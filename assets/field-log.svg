<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="960"
     height="460"
     viewBox="0 0 960 460"
     role="img"
     aria-labelledby="field-title field-desc"
     focusable="false">
  <title id="field-title">Stophemo Field Log</title>
  <desc id="field-desc">An animated field map. A small probe visits Woo, Woo Todo, Digital Brain, T101 and New API before following an unfinished route toward AI.</desc>

  <style>
    .mono {
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      letter-spacing: 0;
    }

    .grid-drift { animation: grid-drift 16s linear infinite; }
    .scan-line { animation: scan-line 12s ease-in-out infinite; }
    .route-live { animation: route-live 12s ease-in-out infinite; }
    .route-next { animation: route-next 3.2s linear infinite; }
    .probe { animation: probe-route 12s cubic-bezier(.45, 0, .2, 1) infinite; }
    .probe-core { animation: probe-core 1.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .probe-ring { animation: probe-ring 2.4s ease-out infinite; transform-box: fill-box; transform-origin: center; }
    .node-woo { animation: node-woo 12s ease-out infinite; transform-box: fill-box; transform-origin: center; }
    .node-todo { animation: node-todo 12s ease-out infinite; transform-box: fill-box; transform-origin: center; }
    .node-brain { animation: node-brain 12s ease-out infinite; transform-box: fill-box; transform-origin: center; }
    .node-t101 { animation: node-t101 12s ease-out infinite; transform-box: fill-box; transform-origin: center; }
    .node-newapi { animation: node-newapi 12s ease-out infinite; transform-box: fill-box; transform-origin: center; }
    .node-ai { animation: node-ai 4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .log-0 { animation: log-0 12s steps(1, end) infinite; }
    .log-1 { animation: log-1 12s steps(1, end) infinite; }
    .log-2 { animation: log-2 12s steps(1, end) infinite; }
    .log-3 { animation: log-3 12s steps(1, end) infinite; }
    .log-4 { animation: log-4 12s steps(1, end) infinite; }
    .log-5 { animation: log-5 12s steps(1, end) infinite; }
    .signal { animation: signal 2.4s steps(2, end) infinite; }
    .tick-a { animation: tick 3.6s ease-in-out infinite; }
    .tick-b { animation: tick 3.6s ease-in-out -1.2s infinite; }
    .tick-c { animation: tick 3.6s ease-in-out -2.4s infinite; }

    @keyframes grid-drift {
      from { transform: translate(0, 0); }
      to { transform: translate(24px, 24px); }
    }

    @keyframes scan-line {
      0%, 8% { transform: translateX(0); opacity: 0; }
      14% { opacity: .38; }
      82% { opacity: .16; }
      92%, 100% { transform: translateX(690px); opacity: 0; }
    }

    @keyframes route-live {
      0%, 8% { stroke-dashoffset: 1; opacity: .2; }
      67%, 88% { stroke-dashoffset: .06; opacity: .9; }
      100% { stroke-dashoffset: 0; opacity: 0; }
    }

    @keyframes route-next {
      to { stroke-dashoffset: -28; }
    }

    @keyframes probe-route {
      0%, 7% { transform: translate(250px, 340px); opacity: 0; }
      10% { opacity: 1; }
      23% { transform: translate(345px, 275.9px); opacity: 1; }
      40% { transform: translate(455.2px, 307.5px); }
      58% { transform: translate(550.2px, 243.4px); }
      68% { transform: translate(660.3px, 275px); }
      79% { transform: translate(755.3px, 210.9px); }
      90% { transform: translate(850.4px, 146.8px); }
      100% { transform: translate(850.4px, 146.8px); opacity: 0; }
    }

    @keyframes probe-core {
      0%, 100% { transform: scale(.82); opacity: .72; }
      50% { transform: scale(1); opacity: 1; }
    }

    @keyframes probe-ring {
      0% { transform: scale(.45); opacity: .7; }
      72%, 100% { transform: scale(1.9); opacity: 0; }
    }

    @keyframes node-woo {
      0%, 17% { transform: scale(.65); opacity: .22; }
      23% { transform: scale(1.35); opacity: 1; }
      29%, 100% { transform: scale(1); opacity: .72; }
    }

    @keyframes node-todo {
      0%, 34% { transform: scale(.65); opacity: .22; }
      40% { transform: scale(1.35); opacity: 1; }
      46%, 100% { transform: scale(1); opacity: .72; }
    }

    @keyframes node-brain {
      0%, 52% { transform: scale(.65); opacity: .22; }
      58% { transform: scale(1.35); opacity: 1; }
      64%, 100% { transform: scale(1); opacity: .72; }
    }
    @keyframes node-t101 {
      0%, 62% { transform: scale(.65); opacity: .22; }
      68% { transform: scale(1.35); opacity: 1; }
      74%, 100% { transform: scale(1); opacity: .72; }
    }
    @keyframes node-newapi {
      0%, 73% { transform: scale(.65); opacity: .22; }
      79% { transform: scale(1.35); opacity: 1; }
      85%, 100% { transform: scale(1); opacity: .72; }
    }

    @keyframes node-ai {
      0%, 100% { transform: scale(.78); opacity: .42; }
      50% { transform: scale(1.08); opacity: 1; }
    }

    @keyframes log-0 { 0%, 10% { opacity: 1; } 11%, 100% { opacity: 0; } }
    @keyframes log-1 { 0%, 10% { opacity: 0; } 11%, 27% { opacity: 1; } 28%, 100% { opacity: 0; } }
    @keyframes log-2 { 0%, 27% { opacity: 0; } 28%, 44% { opacity: 1; } 45%, 100% { opacity: 0; } }
    @keyframes log-3 { 0%, 44% { opacity: 0; } 45%, 61% { opacity: 1; } 62%, 100% { opacity: 0; } }
    @keyframes log-4 { 0%, 61% { opacity: 0; } 62%, 78% { opacity: 1; } 79%, 100% { opacity: 0; } }
    @keyframes log-5 { 0%, 78% { opacity: 0; } 79%, 100% { opacity: 1; } }

    @keyframes signal {
      0%, 72% { opacity: 1; }
      73%, 100% { opacity: .28; }
    }

    @keyframes tick {
      0%, 100% { opacity: .18; }
      50% { opacity: .86; }
    }

    @media (prefers-reduced-motion: reduce) {
      .grid-drift,
      .scan-line,
      .route-live,
      .route-next,
      .probe,
      .probe-core,
      .probe-ring,
      .node-woo,
      .node-todo,
      .node-brain,
      .node-t101,
      .node-newapi,
      .node-ai,
      .log-0,
      .log-1,
      .log-2,
      .log-3,
      .log-4,
      .log-5,
      .signal,
      .tick-a,
      .tick-b,
      .tick-c { animation: none !important; }

      .scan-line,
      .probe-ring,
      .log-0,
      .log-1,
      .log-2,
      .log-3,
      .log-4 { display: none; }

      .route-live { stroke-dashoffset: .06; opacity: .9; }
      .probe { transform: translate(850.4px, 146.8px); opacity: 1; }
      .node-woo,
      .node-todo,
      .node-brain,
      .node-t101,
      .node-newapi { opacity: .72; }
      .node-ai,
      .log-5 { opacity: 1; }
    }
  </style>

  <defs>
    <clipPath id="map-clip">
      <rect x="218" y="62" width="714" height="326"/>
    </clipPath>
    <pattern id="field-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#232830" stroke-width="1"/>
      <circle cx="1" cy="1" r="1" fill="#363D46"/>
    </pattern>
  </defs>

  <rect width="960" height="460" fill="#0B0D10"/>
  <rect x="1" y="1" width="958" height="458" fill="none" stroke="#2A3038"/>
  <rect width="6" height="460" fill="#65D6A6"/>

  <g class="mono">
    <path d="M6 62H960 M6 388H960" stroke="#2A3038"/>
    <path d="M218 62V388" stroke="#2A3038"/>

    <text x="26" y="31" fill="#E7E9EC" font-size="18" font-weight="800">STOPHEMO</text>
    <text x="113" y="31" fill="#8B949E" font-size="14" font-weight="700">FIELD LOG / 07</text>
    <g transform="translate(690 23)">
      <circle class="signal" cx="0" cy="4" r="3" fill="#65D6A6"/>
      <text x="12" y="8" fill="#8B949E" font-size="13" font-weight="700">FULL-STACK / EXPLORING AI</text>
    </g>

    <g transform="translate(26 96)">
      <text y="0" fill="#8B949E" font-size="13" font-weight="700">FIELD NOTE 001</text>
      <text y="45" fill="#E7E9EC" font-size="28" font-weight="800">FOLLOW</text>
      <text y="78" fill="#E7E9EC" font-size="28" font-weight="800">CURIOSITY.</text>
      <path d="M0 94H82" stroke="#65D6A6" stroke-width="4"/>
      <path d="M88 94H112" stroke="#E6B566" stroke-width="4"/>

      <text y="132" fill="#8B949E" font-size="13" font-weight="700">LIVE ENTRY</text>
      <g fill="#C8CDD2" font-size="14" font-weight="700">
        <text class="log-0" y="154">BOOTING FIELD SCAN</text>
        <text class="log-1" y="154" opacity="0">SIGNAL / WOO</text>
        <text class="log-2" y="154" opacity="0">SIGNAL / WOO-TODO</text>
        <text class="log-3" y="154" opacity="0">SIGNAL / BRAIN</text>
        <text class="log-4" y="154" opacity="0">SIGNAL / T101</text>
        <text class="log-5" y="154" opacity="0">SIGNAL / NEW-API</text>
      </g>

      <path d="M0 176H164" stroke="#2A3038"/>
      <text y="202" fill="#8B949E" font-size="13" font-weight="700">PUBLIC REPOS</text>
      <text data-stat="repos" x="164" y="202" text-anchor="end" fill="#65D6A6" font-size="15" font-weight="800">06</text>
      <text y="226" fill="#8B949E" font-size="13" font-weight="700">OPEN ROUTES</text>
      <text data-stat="open" x="164" y="226" text-anchor="end" fill="#E6B566" font-size="15" font-weight="800">01</text>
      <text y="264" fill="#8B949E" font-size="12" font-weight="700">BUILD / TEST / KEEP MOVING</text>
    </g>

    <g clip-path="url(#map-clip)">
      <rect x="218" y="62" width="714" height="326" fill="#0E1115"/>
      <g class="grid-drift">
        <rect x="194" y="38" width="762" height="374" fill="url(#field-grid)" opacity=".68"/>
      </g>

      <g fill="#8B949E" font-size="12" font-weight="700">
        <text x="235" y="83">GRID / 07.24</text>
        <text x="820" y="83">SIGNAL / OPEN</text>
        <text x="235" y="372">ROUTE / ACTIVE</text>
        <text x="839" y="372">SCALE 1:07</text>
      </g>

      <g opacity=".36" stroke="#65707B" fill="none">
        <path d="M250 340L345 275.9L455.2 307.5L550.2 243.4L660.3 275L755.3 210.9L850.4 146.8L923.3 97.6" stroke-dasharray="3 9"/>
        <circle cx="250" cy="340" r="15"/>
        <circle cx="345" cy="275.9" r="22"/>
        <circle cx="455.2" cy="307.5" r="22"/>
        <circle cx="550.2" cy="243.4" r="22"/>
        <circle cx="660.3" cy="275" r="22"/>
        <circle cx="755.3" cy="210.9" r="22"/>
      </g>

      <path class="route-live"
            d="M250 340L345 275.9L455.2 307.5L550.2 243.4L660.3 275L755.3 210.9L850.4 146.8"
            pathLength="1"
            fill="none"
            stroke="#65D6A6"
            stroke-width="2"
            stroke-dasharray="1"
            stroke-dashoffset="1"/>
      <path class="route-next"
            d="M850.4 146.8L923.3 97.6"
            fill="none"
            stroke="#E6B566"
            stroke-width="1.5"
            stroke-dasharray="3 8"/>

      <g aria-hidden="true">
        <g transform="translate(345 275.9)">
          <circle class="node-woo" r="8" fill="#0E1115" stroke="#65D6A6" stroke-width="2"/>
          <circle r="2.5" fill="#65D6A6"/>
        </g>
        <g transform="translate(455.2 307.5)">
          <circle class="node-todo" r="8" fill="#0E1115" stroke="#65D6A6" stroke-width="2"/>
          <circle r="2.5" fill="#65D6A6"/>
        </g>
        <g transform="translate(550.2 243.4)">
          <circle class="node-brain" r="8" fill="#0E1115" stroke="#65D6A6" stroke-width="2"/>
          <circle r="2.5" fill="#65D6A6"/>
        </g>
        <g transform="translate(660.3 275)">
          <circle class="node-t101" r="8" fill="#0E1115" stroke="#65D6A6" stroke-width="2"/>
          <circle r="2.5" fill="#65D6A6"/>
        </g>
        <g transform="translate(755.3 210.9)">
          <circle class="node-newapi" r="8" fill="#0E1115" stroke="#65D6A6" stroke-width="2"/>
          <circle r="2.5" fill="#65D6A6"/>
        </g>
        <g transform="translate(850.4 146.8)">
          <circle class="node-ai" r="16" fill="none" stroke="#E6B566"/>
          <circle r="5" fill="#E6B566"/>
          <path d="M-27 0H-20M20 0H27M0-27V-20M0 20V27" stroke="#E6B566"/>
        </g>
      </g>

      <g fill="#8B949E" font-size="13" font-weight="700">
        <text x="345" y="253.9" text-anchor="middle">01 / WOO</text>
        <text x="455.2" y="285.5" text-anchor="middle">02 / WOO-TODO</text>
        <text x="550.2" y="221.4" text-anchor="middle" fill="#E6B566">03 / DIGITAL-BRAIN</text>
        <text x="660.3" y="253" text-anchor="middle">04 / T101</text>
        <text x="755.3" y="188.9" text-anchor="middle">05 / NEW-API</text>
        <text x="850.4" y="190.8" text-anchor="middle" fill="#E6B566">AI / NEXT</text>
      </g>

      <g class="probe" opacity="0" aria-hidden="true">
        <circle class="probe-ring" r="14" fill="none" stroke="#76B7FF"/>
        <g class="probe-core">
          <path d="M0-9L7 0L0 9L-7 0Z" fill="#E7E9EC"/>
          <path d="M0-4L3 0L0 4L-3 0Z" fill="#76B7FF"/>
        </g>
      </g>

      <g class="scan-line" opacity="0" aria-hidden="true">
        <rect x="218" y="62" width="28" height="326" fill="#76B7FF" opacity=".04"/>
        <path d="M246 62V388" stroke="#76B7FF" opacity=".55"/>
      </g>

      <g fill="#76B7FF">
        <circle class="tick-a" cx="300" cy="142" r="1.5"/>
        <circle class="tick-b" cx="456" cy="116" r="1.5"/>
        <circle class="tick-c" cx="747" cy="322" r="1.5"/>
      </g>
    </g>

    <g transform="translate(26 422)">
      <text fill="#E7E9EC" font-size="15" font-weight="700">BUILD SYSTEMS. FOLLOW CURIOSITY.</text>
      <g transform="translate(638 0)">
        <circle class="signal" cx="0" cy="-4" r="3" fill="#E6B566"/>
        <text x="13" fill="#8B949E" font-size="13" font-weight="700">ROUTE STILL UNFOLDING</text>
      </g>
    </g>
  </g>
</svg>
