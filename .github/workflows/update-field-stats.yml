name: 同步 banner 数字

# 把主页 banner 上的 PUBLIC REPOS / OPEN ROUTES 换成实时数据。
# 数字没变时脚本不写文件，这一步不会产生提交。

on:
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/scripts/update-field-stats.mjs"
      - ".github/workflows/update-field-stats.yml"

permissions:
  contents: write

concurrency:
  group: field-stats
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          ref: main

      - name: 写入实时数字
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USER: ${{ github.repository_owner }}
        run: node .github/scripts/update-field-stats.mjs

      - name: 提交更新
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "数字没有变化，跳过提交"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git add README.md assets/field-log.svg assets/field-log-mobile.svg assets/field-log-compact.svg
          git commit -m "chore(profile): 同步 banner 数字"
          git push
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      # jsDelivr 对 @main 这类分支引用会缓存数小时，主动清一下，
      # 保证 GitHub 的图片代理下一次取到的是新图。失败不影响主页。
      - name: 清理 jsDelivr 缓存
        if: steps.commit.outputs.pushed == 'true'
        continue-on-error: true
        run: |
          for file in field-log.svg field-log-mobile.svg field-log-compact.svg; do
            url="https://purge.jsdelivr.net/gh/${{ github.repository }}@main/assets/$file"
            echo "清理 $url"
            curl -sS --max-time 20 "$url" || true
            echo
          done
